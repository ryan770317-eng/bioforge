# 推播排程：每 15 分鐘打一次 dispatch，由它依台北時間決定該發什麼。
# 涵蓋台北 07:00–22:00（UTC 23:00–14:00）。Vercel cron 另有兩個每日備援。
name: push-dispatch

on:
  schedule:
    - cron: "*/15 23,0-13 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call dispatch endpoint
        run: |
          curl -fsS -m 30 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://bioforge-two.vercel.app/api/push/dispatch"
